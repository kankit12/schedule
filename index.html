<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#592A8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Class Nav">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no">

  <title>Class Navigator — ECU</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: light dark;

      --font-ui: "DM Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      --font-display: "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;

      --purple: #592A8A;
      --purple-deep: #3D1C60;
      --gold: #FDC82F;
      --blue: #2563EB;
      --green: #16865A;
      --red: #B4233B;

      --safe-top: max(env(safe-area-inset-top), 12px);
      --safe-bottom: max(env(safe-area-inset-bottom), 16px);

      --page: #F2F2F7;
      --surface: #FFFFFF;
      --surface-alt: #F7F7FA;
      --surface-soft: #EFEFF4;
      --text: #111218;
      --text-secondary: #5E6170;
      --text-tertiary: #858999;
      --border: rgba(17, 18, 24, 0.10);
      --border-strong: rgba(17, 18, 24, 0.18);
      --accent-soft: rgba(89, 42, 138, 0.10);
      --blue-soft: rgba(37, 99, 235, 0.10);
      --green-soft: rgba(22, 134, 90, 0.10);
      --red-soft: rgba(180, 35, 59, 0.10);
      --shadow: 0 8px 22px rgba(20, 20, 30, 0.06);
      --shadow-raised: 0 16px 40px rgba(20, 20, 30, 0.12);
    }

    html[data-theme="dark"] {
      --page: #000000;
      --surface: #1C1C1E;
      --surface-alt: #252527;
      --surface-soft: #2C2C2E;
      --text: #F5F5F7;
      --text-secondary: #AEAEB2;
      --text-tertiary: #77777D;
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.20);
      --accent-soft: rgba(170, 117, 255, 0.18);
      --blue-soft: rgba(95, 161, 255, 0.16);
      --green-soft: rgba(58, 202, 130, 0.16);
      --red-soft: rgba(255, 112, 132, 0.16);
      --shadow: none;
      --shadow-raised: 0 18px 42px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background: var(--page);
    }

    body {
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 8px) 16px calc(var(--safe-bottom) + 20px);
      color: var(--text);
      background: var(--page);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 3px solid rgba(89, 42, 138, 0.55);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(100%, 1140px);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    @media (min-width: 950px) {
      .app-shell {
        grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.75fr);
        align-items: start;
      }

      .side-column {
        position: sticky;
        top: 20px;
      }
    }

    .main-panel {
      min-width: 0;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 4px 2px 20px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      color: var(--purple);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-mark::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 2px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 1.4rem + 1.2vw, 2.45rem);
      line-height: 1.05;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    .header-date {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .theme-btn svg {
      width: 19px;
      height: 19px;
    }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .week-cell {
      min-height: 58px;
      padding: 8px 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-secondary);
      text-align: center;
      box-shadow: var(--shadow);
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .week-cell small {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .week-cell strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .week-cell.is-today {
      border-color: rgba(89, 42, 138, 0.45);
    }

    .week-cell.is-active {
      border-color: var(--purple);
      background: var(--purple);
      color: #fff;
      box-shadow: 0 8px 18px rgba(89, 42, 138, 0.22);
    }

    .week-cell.is-active strong {
      color: #fff;
    }

    .holiday-note {
      min-height: 17px;
      margin-bottom: 12px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .viewing-chip {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
    }

    .viewing-chip.show {
      display: flex;
    }

    .viewing-chip button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: var(--purple);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .status-card {
      margin-bottom: 16px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #fff;
      background:
        linear-gradient(135deg, var(--purple) 0%, var(--purple-deep) 100%);
      box-shadow: 0 16px 32px rgba(61, 28, 96, 0.22);
    }

    .status-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .status-tag.in-class {
      border-color: rgba(118, 255, 183, 0.36);
      background: rgba(42, 194, 113, 0.18);
      color: #BDFBD8;
    }

    .countdown-title {
      overflow: hidden;
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .countdown-timer {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 2rem + 2.4vw, 3.6rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.07em;
      font-variant-numeric: tabular-nums;
    }

    .countdown-subtext {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 500;
    }

    .leave-row {
      display: none;
      width: fit-content;
      min-height: 34px;
      align-items: center;
      margin-top: 14px;
      padding: 0 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .progress-container {
      display: none;
      height: 5px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #47D78C;
      transition: width 400ms linear;
    }

    .day-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      margin-bottom: 16px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .day-btn {
      min-height: 42px;
      border-radius: 8px;
      color: var(--text-secondary);
      background: transparent;
      font-size: 14px;
      font-weight: 700;
    }

    .day-btn.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 5px rgba(20, 20, 30, 0.14);
    }

    .class-card,
    .pack-card,
    .utility-card,
    .empty-state {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .class-card {
      margin-bottom: 12px;
      padding: 18px;
    }

    .class-card.is-active-class {
      border-color: rgba(89, 42, 138, 0.45);
      box-shadow: 0 12px 28px rgba(89, 42, 138, 0.11);
    }

    .class-card.is-past {
      opacity: 0.62;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .class-time,
    .walk-badge,
    .live-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .class-time {
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--surface-alt);
    }

    .walk-badge {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .live-badge {
      gap: 6px;
      width: fit-content;
      margin-bottom: 10px;
      color: var(--green);
      background: var(--green-soft);
    }

    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .class-title {
      margin-bottom: 8px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.03em;
    }

    .class-location {
      margin-bottom: 14px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .checklist-container {
      margin-bottom: 14px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-alt);
    }

    .checklist-title {
      margin-bottom: 10px;
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .checklist-items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .checklist-item,
    .pack-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .checklist-item input,
    .pack-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--purple);
      flex: 0 0 auto;
    }

    .nav-btn {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--purple);
      background: var(--accent-soft);
      font-size: 14px;
      font-weight: 800;
    }

    .nav-row {
      display: grid;
      gap: 8px;
    }

    .pack-card {
      margin-bottom: 12px;
      padding: 18px;
    }

    .card-kicker,
    .utility-header {
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .pack-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
    }

    .pack-head strong {
      color: var(--text);
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .pack-head button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      color: var(--text-secondary);
      background: var(--surface-alt);
      font-size: 12px;
      font-weight: 800;
    }

    .pack-items {
      display: grid;
      gap: 9px;
    }

    .pack-item input[type="text"],
    .pack-add input {
      width: 100%;
      min-height: 43px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: var(--surface-alt);
      font-size: 14px;
    }

    .pack-item input[type="text"]:focus,
    .pack-add input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(89, 42, 138, 0.14);
    }

    .pack-item .del {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: var(--red);
      background: var(--red-soft);
      font-size: 17px;
      font-weight: 700;
    }

    .pack-add {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }

    .pack-add button {
      min-width: 70px;
      min-height: 43px;
      padding: 0 14px;
      border-radius: 8px;
      color: #fff;
      background: var(--purple);
      font-size: 14px;
      font-weight: 800;
    }

    .utility-card {
      padding: 18px;
    }

    .utility-header {
      margin-bottom: 12px;
    }

    .weather-info {
      min-height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      background: var(--surface-alt);
      font-size: 14px;
      font-weight: 600;
    }

    .weather-info strong {
      color: var(--text);
      font-weight: 800;
      text-align: right;
    }

    .hourly-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 10px 0 14px;
    }

    .hourly-chip {
      min-width: 0;
      padding: 8px 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-tertiary);
      background: var(--surface-alt);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .hourly-chip strong {
      display: block;
      margin: 2px 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .utility-btn {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--purple);
      background: var(--accent-soft);
      font-size: 14px;
      font-weight: 800;
    }

    .utility-btn + .utility-btn {
      margin-top: 8px;
      color: var(--text-secondary);
      background: var(--surface-alt);
    }

    .empty-state {
      padding: 38px 20px;
      color: var(--text-secondary);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 8px);
      z-index: 1000;
      width: min(92vw, 400px);
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-raised);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      transform: translate(-50%, 140%);
      transition: transform 220ms ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    @media (max-width: 560px) {
      .app-header {
        padding-bottom: 16px;
      }

      .checklist-items {
        grid-template-columns: 1fr;
      }

      .pack-add {
        grid-template-columns: 1fr;
      }

      .pack-add button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="main-panel">
      <header class="app-header">
        <div>
          <div class="brand-mark">ECU</div>
          <h1>Class Navigator</h1>
          <p class="header-date" id="headerDate"></p>
        </div>

        <button class="theme-btn" id="themeBtn" aria-label="Switch appearance">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <div class="week-strip" id="weekStrip"></div>
      <div class="holiday-note" id="weekHoliday"></div>

      <div class="viewing-chip" id="viewingChip">
        <span id="viewingText">Viewing another day</span>
        <button type="button" id="jumpTodayBtn">Today</button>
      </div>

      <section class="status-card" id="statusCard" aria-live="polite">
        <div class="status-topline">
          <span class="status-tag" id="statusTag">Next Class</span>
        </div>

        <div class="countdown-title" id="countdownTitle">Loading schedule...</div>
        <div class="countdown-timer" id="countdownTimer">--:--:--</div>
        <div class="countdown-subtext" id="countdownSubtext">Calculating your schedule</div>

        <div class="leave-row" id="leaveRow"></div>

        <div class="progress-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </section>

      <nav class="day-selector" aria-label="Select weekday">
        <button class="day-btn" data-day="Monday">Mon</button>
        <button class="day-btn" data-day="Tuesday">Tue</button>
        <button class="day-btn" data-day="Wednesday">Wed</button>
        <button class="day-btn" data-day="Thursday">Thu</button>
        <button class="day-btn" data-day="Friday">Fri</button>
      </nav>

      <section id="scheduleContainer" aria-live="polite"></section>
    </main>

    <aside class="side-column">
      <section class="utility-card">
        <div class="utility-header">Campus Conditions</div>

        <div class="weather-info" id="weatherWidget">
          <span>Loading weather...</span>
        </div>

        <div class="weather-info" id="gpsWidget">
          <span>Location not tracked</span>
        </div>

        <div class="hourly-row" id="hourlyRow"></div>

        <div class="holiday-note" id="calendarNote"></div>

        <button class="utility-btn" id="notifyBtn">
          Enable class reminders
        </button>

        <button class="utility-btn" id="calendarBtn">
          Export schedule (.ics)
        </button>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DAY_NAMES = [
      "Sunday",
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday"
    ];

    const TERM_START = "2026-08-17";
    const TERM_END = new Date("2026-12-11T23:59:59");

    const buildings = {
      greene: {
        label: "Greene Hall",
        maps: "Greene Hall, East Carolina University",
        lat: 35.6056,
        lon: -77.3668
      },
      scitech: {

    function ymd(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function getDateForClass(baseDate, dayName) {
      const targetDay = DAY_NAMES.indexOf(dayName);
      const date = new Date(baseDate);
      const difference = (targetDay - date.getDay() + 7) % 7;

      date.setDate(date.getDate() + difference);
      return date;
    }

    function parseTime(timeString, baseDate) {
      const [hours, minutes] = timeString.split(":").map(Number);
      const date = new Date(baseDate);

      date.setHours(hours, minutes, 0, 0);
      return date;
    }

    function formatClock(date) {
      return date.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function formatDate(date) {
      return date.toLocaleDateString("en-US", {
        weekday: "long",
        month: "short",
        day: "numeric"
      });
    }

    function formatHMS(seconds) {
      const total = Math.max(0, Math.floor(seconds));

      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = Math.floor(total % 60);

      if (days > 0) {
        return `${days}d ${hours}h ${minutes}m`;
      }

      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }

      return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function noteForDate(date) {
      return academicNotes.find(note => note.date === ymd(date))?.title || "";
    }

    function isNoClassDate(date) {
      return (
        date.getDay() === 0 ||
        date.getDay() === 6 ||
        noClassDates.has(ymd(date))
      );

    }

    function haversineFeet(lat1, lon1, lat2, lon2) {
      const earthRadiusMiles = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      const miles =
        earthRadiusMiles * 2 *
        Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return miles * 5280;
    }

    function nearestBuilding(lat, lon) {
      let closest = null;
      let closestFeet = Infinity;

      Object.entries(buildings).forEach(([key, building]) => {
        const feet = haversineFeet(
          lat,
          lon,
          building.lat,
          building.lon
        );

        if (feet < closestFeet) {
          closestFeet = feet;
          closest = {
            key,
            feet,
            ...building
          };
        }
      });

      return closest;
    }

    function walkMinutes(fromKey, toKey) {
      if (!fromKey || !toKey || fromKey === toKey) return 2;

      const baseWalk =
        walkMatrix[fromKey]?.[toKey] ??
        walkMatrix[toKey]?.[fromKey] ??
        8;

      const weatherPenalty =
        state.currentPrecipitation > 0
          ? toKey === "hsc"
            ? 5
            : 3
          : 0;

      return baseWalk + weatherPenalty;
    }

    function originForClass(dayName, classIndex) {
      if (state.lastGps && Date.now() - state.lastGpsAt < 120000) {
        const near = nearestBuilding(
          state.lastGps.lat,
          state.lastGps.lon
        );

        if (near.feet < 500) {
          return near.key;
        }
      }

      if (classIndex <= 0) {
        return "greene";
      }

      const priorClass = schedule[dayName][classIndex - 1];
      const currentClass = schedule[dayName][classIndex];

      const [priorHour, priorMinute] = priorClass.end.split(":").map(Number);
      const [currentHour, currentMinute] = currentClass.start.split(":").map(Number);

      const gap =
        currentHour * 60 +
        currentMinute -
        (priorHour * 60 + priorMinute);

      return gap <= 90 ? priorClass.buildingKey : "greene";
    }

    function alreadyThere(destinationKey) {
      if (!state.lastGps || Date.now() - state.lastGpsAt > 120000) {
        return false;
      }

      const building = buildings[destinationKey];

      return haversineFeet(
        state.lastGps.lat,
        state.lastGps.lon,
        building.lat,
        building.lon
      ) < 400;
    }

    function mapLink(destinationKey) {
      const destination = buildings[destinationKey].maps;

      let origin = buildings.greene.maps;

      if (state.lastGps && Date.now() - state.lastGpsAt < 120000) {

      }

      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=walking`;
    }

    function getNextClass() {
      const now = new Date();

      for (let offset = 0; offset < 14; offset++) {
        const date = new Date(now);
        date.setDate(now.getDate() + offset);
        date.setHours(0, 0, 0, 0);

        if (isNoClassDate(date)) {
          continue;
        }

        const dayName = DAY_NAMES[date.getDay()];
        const classes = schedule[dayName] || [];

        for (let index = 0; index < classes.length; index++) {
          const classItem = classes[index];
          const start = parseTime(classItem.start, date);
          const end = parseTime(classItem.end, date);

          if (offset === 0 && now > end) {
            continue;
          }

          return {
            classItem,
            dayName,
            index,
            date,
            start,
            end
          };
        }
      }

      return null;
    }

    function updateStatus() {
      const now = new Date();

      const tag = document.getElementById("statusTag");
      const title = document.getElementById("countdownTitle");
      const timer = document.getElementById("countdownTimer");
      const subtext = document.getElementById("countdownSubtext");
      const leaveRow = document.getElementById("leaveRow");
      const progressContainer = document.getElementById("progressContainer");
      const progressBar = document.getElementById("progressBar");

      leaveRow.style.display = "none";
      progressContainer.style.display = "none";
      tag.classList.remove("in-class");

      const todayName = DAY_NAMES[now.getDay()];
      const todayClasses = schedule[todayName] || [];

      for (let index = 0; index < todayClasses.length; index++) {
        const classItem = todayClasses[index];
        const start = parseTime(classItem.start, now);
        const end = parseTime(classItem.end, now);

        if (now >= start && now <= end) {
          tag.textContent = "In Class";
          tag.classList.add("in-class");

          title.textContent = classItem.title;
          timer.textContent = formatHMS((end - now) / 1000);
          subtext.textContent = `Ends ${formatClock(end)} · ${classItem.room}`;

          progressContainer.style.display = "block";
          progressBar.style.width = `${((now - start) / (end - start)) * 100}%`;

          return;
        }
      }

      const next = getNextClass();

      if (!next) {
        tag.textContent = "Schedule Complete";
        title.textContent = "No remaining classes";
        timer.textContent = "—";
        subtext.textContent = "Your current schedule has ended.";
        return;
      }

      const travelOrigin = originForClass(next.dayName, next.index);
      const travelTime = alreadyThere(next.classItem.buildingKey)
        ? 0
        : walkMinutes(travelOrigin, next.classItem.buildingKey);

      const leaveAt = new Date(next.start.getTime() - travelTime * 60000);
      const timeUntil = (next.start - now) / 1000;

      tag.textContent = "Next Class";
      title.textContent = next.classItem.title;
      timer.textContent = formatHMS(timeUntil);

      const isToday = ymd(next.date) === ymd(now);

      subtext.textContent = isToday
        ? `Today at ${formatClock(next.start)} · ${next.classItem.room}`
        : `${formatDate(next.date)} at ${formatClock(next.start)} · ${next.classItem.room}`;

      leaveRow.style.display = "inline-flex";

      if (travelTime === 0) {
        leaveRow.textContent = "You are already there";
      } else {
        leaveRow.textContent = `Leave by ${formatClock(leaveAt)} · ${travelTime} min walk`;
      }

      maybeNotify(next.classItem, next.start, leaveAt);
    }

    function maybeNotify(classItem, classStart, leaveAt) {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;

      const dateKey = ymd(classStart);
      const notificationKey = `${dateKey}:${classItem.id}`;

      if (state.notified[notificationKey]) return;

      const now = Date.now();

      if (
        now >= leaveAt.getTime() - 30000 &&
        now <= leaveAt.getTime() + 120000
      ) {
        new Notification("Class Navigator", {
          body: `Leave now for ${classItem.title} — ${classItem.room}`,
          tag: notificationKey,
          renotify: false
        });

        state.notified[notificationKey] = true;
        save("navNotified", state.notified);
      }
    }

    function renderSchedule() {

      if (!dayClasses.length) {
        container.innerHTML = `

        const selectedDate = getDateForClass(now, state.activeDay);
        const start = parseTime(classItem.start, selectedDate);
        const end = parseTime(classItem.end, selectedDate);

        const isToday = state.activeDay === DAY_NAMES[now.getDay()];
        const isActive = isToday && now >= start && now <= end;
        const isPast = isToday && now > end;

        const origin = originForClass(state.activeDay, index);

        const travelMinutes = alreadyThere(classItem.buildingKey)
          ? 0
          : walkMinutes(origin, classItem.buildingKey);

        return `
          <article class="class-card ${isActive ? "is-active-class" : ""} ${isPast ? "is-past" : ""}">

    function bindPackControls() {
      document.querySelectorAll("[data-pack-day]").forEach(input => {
        input.addEventListener("change", event => {
          const day = event.target.dataset.packDay;
          const index = Number(event.target.dataset.packIndex);
          const nextValue = event.target.value.trim();

          if (nextValue) {
            state.packLists[day][index] = nextValue;
            save("packLists", state.packLists);
          }
        });
      });

      document.querySelectorAll("[data-delete-day]").forEach(button => {
        button.addEventListener("click", () => {
          const day = button.dataset.deleteDay;
          const index = Number(button.dataset.deleteIndex);

          state.packLists[day].splice(index, 1);

          save("packLists", state.packLists);
          renderSchedule();
        });
      });

      document.querySelectorAll("[data-reset-pack]").forEach(button => {
        button.addEventListener("click", () => {
          const day = button.dataset.resetPack;

          state.packLists[day] = [...defaultPackLists[day]];

          save("packLists", state.packLists);

          renderSchedule();
          showToast("Packing list reset.");
        });
      });

      const addButton = document.getElementById("packAddBtn");
      const addInput = document.getElementById("packAddInput");

      function addPackingItem() {
        const item = addInput.value.trim();

        if (!item) return;

        state.packLists[state.activeDay].push(item);

        save("packLists", state.packLists);

        addInput.value = "";
        renderSchedule();
      }

      addButton?.addEventListener("click", addPackingItem);

      addInput?.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          addPackingItem();
        }
      });
    }

    async function fetchWeather() {
      try {
        const response = await fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=35.6127&longitude=-77.3663&current=temperature_2m,precipitation,weather_code&hourly=temperature_2m,precipitation&timezone=America%2FNew_York"
        );

        const data = await response.json();

        const currentTemp = Math.round(
          (data.current.temperature_2m * 9 / 5) + 32
        );

        state.currentPrecipitation = data.current.precipitation || 0;

        const weatherCode = data.current.weather_code;

        let label = "Clear";

        if (
          state.currentPrecipitation > 0 ||
          (weatherCode >= 51 && weatherCode < 70) ||
          (weatherCode >= 80 && weatherCode < 90)
        ) {
          label = "Raining";
        } else if (weatherCode >= 95) {
          label = "Storms";
        } else if (weatherCode >= 2) {
          label = "Cloudy";
        }

        document.getElementById("weatherWidget").innerHTML = `
          <span>Greenville</span>
          <strong>${currentTemp}°F · ${label}</strong>
        `;

        const now = new Date();

        state.hourlyForecast = [];

        data.hourly.time.forEach((timeString, index) => {
          const date = new Date(timeString);

          if (date >= now && state.hourlyForecast.length < 5) {
            state.hourlyForecast.push({
              time: date.toLocaleTimeString("en-US", {
                hour: "numeric"
              }),
              temp: Math.round(
                (data.hourly.temperature_2m[index] * 9 / 5) + 32
              ),
              precipitation: data.hourly.precipitation[index]
            });
          }
        });

        document.getElementById("hourlyRow").innerHTML =
          state.hourlyForecast
            .map(hour => `
              <div class="hourly-chip">
                ${hour.time}
                <strong>${hour.temp}°</strong>
                ${hour.precipitation > 0 ? "Rain" : "Dry"}
              </div>
            `)
            .join("");
      } catch {
        document.getElementById("weatherWidget").innerHTML = `
          <span>Greenville</span>
          <strong>Unavailable</strong>
        `;
      }
    }

    function maybeTrackGPS() {
      if (state.gpsDenied || !navigator.geolocation) return;
      if (Date.now() - state.lastGpsAt < 45000) return;

      navigator.geolocation.getCurrentPosition(
        position => {
          state.lastGps = {
            lat: position.coords.latitude,
            lon: position.coords.longitude
          };

          state.lastGpsAt = Date.now();

          const nearest = nearestBuilding(
            state.lastGps.lat,
            state.lastGps.lon
          );

          const label = nearest.feet > 1000
            ? `${(nearest.feet / 5280).toFixed(1)} mi from ${nearest.label}`
            : `${Math.round(nearest.feet)} ft from ${nearest.label}`;

          document.getElementById("gpsWidget").innerHTML = `
            <span>GPS</span>
            <strong>${label}</strong>
          `;
        },
        () => {
          state.gpsDenied = true;

          document.getElementById("gpsWidget").innerHTML = `
            <span>GPS unavailable</span>
          `;
        },
        {
          enableHighAccuracy: true,
          timeout: 8000,
          maximumAge: 30000
        }
      );
    }

    function applyTheme(theme) {
      const root = document.documentElement;

      if (theme === "auto") {
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        root.dataset.theme = systemDark ? "dark" : "light";
      } else {
        root.dataset.theme = theme;
      }

      state.theme = theme;
      save("classNavTheme", theme);

      const activeTheme = root.dataset.theme;

      document.getElementById("themeIcon").innerHTML =
        activeTheme === "dark"
          ? `
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          `
          : `
            <path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79z"></path>
          `;
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.dataset.theme;

      applyTheme(currentTheme === "dark" ? "light" : "dark");
    }

    async function enableNotifications() {
      if (!("Notification" in window)) {
        showToast("Notifications are not available in this browser.");
        return;
      }

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        );

      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (isIOS && !isStandalone) {
        showToast(
          "On iPhone, add this site to Home Screen first, then open it there to enable reminders."
        );
        return;
      }

      if (Notification.permission === "granted") {
        document.getElementById("notifyBtn").textContent =
          "Class reminders enabled";

        showToast("Class reminders are already enabled.");
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission === "granted") {
        document.getElementById("notifyBtn").textContent =
          "Class reminders enabled";

        showToast("Class reminders enabled.");
      } else {
        showToast("Notification permission was not granted.");
      }
    }

    function nextWeekdayDate(dayName) {
      const targetDay = DAY_NAMES.indexOf(dayName);
      const date = new Date(`${TERM_START}T09:00:00`);

      const difference =
        (targetDay - date.getDay() + 7) % 7;

      date.setDate(date.getDate() + difference);

      return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, "0")}${String(date.getDate()).padStart(2, "0")}`;
    }

    function exportICS() {
      const calendarLines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Class Navigator//EN",
        "CALSCALE:GREGORIAN"
      ];

      const dayCodes = {
        Monday: "MO",
        Tuesday: "TU",
        Wednesday: "WE",
        Thursday: "TH",
        Friday: "FR"
      };

      Object.entries(schedule).forEach(([dayName, classes]) => {
        classes.forEach((classItem, index) => {
          const date = nextWeekdayDate(dayName);

          const [startHour, startMinute] = classItem.start.split(":");
          const [endHour, endMinute] = classItem.end.split(":");

          calendarLines.push("BEGIN:VEVENT");
          calendarLines.push(`UID:${dayName}-${index}@classnavigator`);
          calendarLines.push(`DTSTART:${date}T${startHour}${startMinute}00`);
          calendarLines.push(`DTEND:${date}T${endHour}${endMinute}00`);
          calendarLines.push(
            `RRULE:FREQ=WEEKLY;BYDAY=${dayCodes[dayName]};UNTIL=20261211T235959`
          );
          calendarLines.push(`SUMMARY:${classItem.title}`);
          calendarLines.push(`LOCATION:${classItem.room}`);
          calendarLines.push("END:VEVENT");
        });
      });

      calendarLines.push("END:VCALENDAR");

      const blob = new Blob(
        [calendarLines.join("\r\n")],
        { type: "text/calendar" }
      );

      const link = document.createElement("a");

      link.href = URL.createObjectURL(blob);
      link.download = "class-navigator.ics";

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(link.href);
    }

    function userSelectDay(dayName) {
      state.activeDay = dayName;
      state.isUserSelected = true;

      refreshUI();
    }

    function jumpToToday() {
      state.activeDay = todayScheduleName();
      state.isUserSelected = false;

      refreshUI();
    }

    function refreshUI() {
      renderWeekStrip();
      renderViewingChip();
      renderDaySelector();
      renderSchedule();

      document.getElementById("calendarNote").textContent =
        noteForDate(new Date()) || "";
    }

    function setupEventListeners() {
      document.querySelectorAll(".day-btn").forEach(button => {
        button.addEventListener("click", () => {
          userSelectDay(button.dataset.day);
        });
      });

      document
        .getElementById("jumpTodayBtn")
        .addEventListener("click", jumpToToday);

      document
        .getElementById("themeBtn")
        .addEventListener("click", toggleTheme);

      document
        .getElementById("notifyBtn")
        .addEventListener("click", enableNotifications);

      document
        .getElementById("calendarBtn")
        .addEventListener("click", exportICS);

      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", () => {
          if (state.theme === "auto") {
            applyTheme("auto");
          }
        });
    }

    function startApp() {
      state.packLists = load(
        "packLists",
        JSON.parse(JSON.stringify(defaultPackLists))
      );

      state.notified = load("navNotified", {});
      state.activeDay = todayScheduleName();

      const savedTheme = load("classNavTheme", "auto");

      applyTheme(savedTheme);

      document.getElementById("headerDate").textContent =
        formatDate(new Date());

      setupEventListeners();
      refreshUI();
      fetchWeather();
      maybeTrackGPS();
      updateStatus();

      setInterval(updateStatus, 1000);
      setInterval(maybeTrackGPS, 60000);
      setInterval(fetchWeather, 15 * 60 * 1000);
    }

    startApp();
  </script>
</body>
</html>
