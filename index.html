<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ecu-purple: #592A8A;
            --ecu-purple-dark: #3D1C60;
            --ecu-purple-light: rgba(89, 42, 138, 0.08);
            --ecu-gold: #FDC82F;
            --bg-canvas: #F8FAFC;
            --surface: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border-subtle: #E2E8F0;
            --radius-card: 20px;
            --radius-btn: 12px;
            --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.03), 0 4px 12px rgba(15, 23, 42, 0.04);
            --shadow-active: 0 8px 20px rgba(89, 42, 138, 0.2);
            --live-green: #10B981;
            --live-green-bg: rgba(16, 185, 129, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-canvas); 
            color: var(--text-primary); 
            min-height: 100vh;
            padding: 24px 16px 40px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ecu-purple);
            background: var(--ecu-purple-light);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .brand-badge::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--ecu-gold);
        }

        h1 { 
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        /* Countdown Card Styling */
        .status-banner {
            background: linear-gradient(135deg, var(--ecu-purple) 0%, var(--ecu-purple-dark) 100%);
            color: white;
            border-radius: var(--radius-card);
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-active);
            position: relative;
            overflow: hidden;
        }

        .status-banner::after {
            content: "";
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(253, 200, 47, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .status-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
        }

        .status-tag.in-class {
            background: var(--live-green-bg);
            color: #34D399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .countdown-title {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .countdown-timer {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .countdown-subtext {
            font-size: 0.8125rem;
            opacity: 0.75;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Day Selector Navigation */
        .day-selector { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr);
            gap: 6px; 
            background: rgba(226, 232, 240, 0.6);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 20px; 
            border: 1px solid var(--border-subtle);
        }

        .day-btn { 
            border: none; 
            padding: 10px 0;
            border-radius: 10px; 
            background: transparent; 
            color: var(--text-secondary); 
            font-weight: 700; 
            font-size: 0.875rem;
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .day-btn:hover {
            color: var(--text-primary);
        }

        .day-btn.active { 
            background-color: var(--surface); 
            color: var(--ecu-purple); 
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }

        /* Card Component Styling */
        .class-card { 
            background: var(--surface); 
            border-radius: var(--radius-card); 
            padding: 20px; 
            margin-bottom: 14px; 
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-subtle);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .class-card.is-active-class {
            border: 2px solid var(--ecu-purple);
            box-shadow: 0 4px 16px rgba(89, 42, 138, 0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .class-time { 
            font-size: 0.8125rem; 
            color: var(--text-secondary); 
            font-weight: 700; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #F1F5F9;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--live-green);
            background: var(--live-green-bg);
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .live-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--live-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .class-title { 
            font-size: 1.0625rem; 
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
            margin-bottom: 10px;
        }

        .class-location { 
            font-size: 0.875rem; 
            color: var(--text-secondary);
            margin-bottom: 18px; 
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .class-location svg {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .nav-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%; 
            padding: 12px 16px; 
            background-color: var(--ecu-purple); 
            color: white; 
            text-decoration: none; 
            border-radius: var(--radius-btn); 
            font-weight: 700; 
            font-size: 0.875rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(89, 42, 138, 0.15);
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        .nav-btn.disabled { 
            background-color: #F1F5F9; 
            color: var(--text-muted);
            pointer-events: none;
            border: 1px solid var(--border-subtle);
            box-shadow: none;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            background: var(--surface);
            border-radius: var(--radius-card);
            border: 1px dashed var(--border-subtle);
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Class Navigator</h1>
            <div class="brand-badge">ECU</div>
        </header>

        <!-- Live Tracker Banner -->
        <div class="status-banner">
            <div class="status-header">
                <span class="status-tag" id="statusTag">Schedule Tracker</span>
            </div>
            <div class="countdown-title" id="countdownTitle">Loading schedule...</div>
            <div class="countdown-timer" id="countdownTimer">--:--:--</div>
            <div class="countdown-subtext" id="countdownSubtext">Calculating time remaining</div>
        </div>
        
        <!-- Day Picker -->
        <nav class="day-selector" id="daySelector" aria-label="Select day of the week">
            <button class="day-btn" onclick="userSelectDay('Monday')">Mon</button>
            <button class="day-btn" onclick="userSelectDay('Tuesday')">Tue</button>
            <button class="day-btn" onclick="userSelectDay('Wednesday')">Wed</button>
            <button class="day-btn" onclick="userSelectDay('Thursday')">Thu</button>
            <button class="day-btn" onclick="userSelectDay('Friday')">Fri</button>
        </nav>

        <!-- Schedule List -->
        <main id="scheduleContainer" aria-live="polite"></main>
    </div>

    <script>
        const origin = "Greene Hall, East Carolina University";
        
        const schedule = {
            Monday: [
                { id: "mon-1", time: "09:00 AM - 09:50 AM", start: "09:00", end: "09:50", title: "CHEM 1150: General Chemistry I", room: "Sci & Tech, 0C307", building: "Science and Technology Building, East Carolina University" }
            ],
            Tuesday: [
                { id: "tue-1", time: "09:00 AM - 09:50 AM", start: "09:00", end: "09:50", title: "HLTH 1000: Health in Modern Society", room: "Brewster, 0C302", building: "Brewster Building, East Carolina University" },
                { id: "tue-2", time: "11:00 AM - 12:15 PM", start: "11:00", end: "12:15", title: "HNRS 2011: BLS Sem in Human", room: "Brewster, 0D207", building: "Brewster Building, East Carolina University" },
                { id: "tue-3", time: "12:30 PM - 01:45 PM", start: "12:30", end: "13:45", title: "BIOL 1100: Principles of Biology I", room: "Austin, 00205", building: "Austin Building, East Carolina University" },
                { id: "tue-4", time: "05:00 PM - 07:00 PM", start: "17:00", end: "19:00", title: "HNRS 2000: Honors Leadership & Service Colloquium", room: "Rawl, 00205", building: "Rawl Building, East Carolina University" }
            ],
            Wednesday: [
                { id: "wed-1", time: "09:00 AM - 09:50 AM", start: "09:00", end: "09:50", title: "CHEM 1150: General Chemistry I", room: "Sci & Tech, 0C307", building: "Science and Technology Building, East Carolina University" },
                { id: "wed-2", time: "11:00 AM - 01:50 PM", start: "11:00", end: "13:50", title: "CHEM 1151: General Chemistry Lab I", room: "Sci & Tech, 00432", building: "Science and Technology Building, East Carolina University" },
                { id: "wed-3", time: "03:30 PM - 06:30 PM", start: "15:30", end: "18:30", title: "HNRS 2002: Survey of Health Professions", room: "Health Sciences Campus", building: "Health Sciences Campus, East Carolina University" }
            ],
            Thursday: [
                { id: "thu-1", time: "11:00 AM - 12:15 PM", start: "11:00", end: "12:15", title: "HNRS 2011: BLS Sem in Human", room: "Brewster, 0D207", building: "Brewster Building, East Carolina University" },
                { id: "thu-2", time: "12:30 PM - 01:45 PM", start: "12:30", end: "13:45", title: "BIOL 1100: Principles of Biology I", room: "Austin, 00205", building: "Austin Building, East Carolina University" }
            ],
            Friday: [
                { id: "fri-1", time: "09:00 AM - 09:50 AM", start: "09:00", end: "09:50", title: "CHEM 1150: General Chemistry I", room: "Sci & Tech, 0C307", building: "Science and Technology Building, East Carolina University" }
            ]
        };

        let activeDay = "";
        let isUserSelected = false;
        let activeClassId = null;

        function getMapLink(destination) {
            if (!destination) return null;
            return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=walking`;
        }

        function parseTime(timeStr, baseDate) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const d = new Date(baseDate);
            d.setHours(hours, minutes, 0, 0);
            return d;
        }

        function formatHMS(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            
            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTracker() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayName = days[now.getDay()];
            
            const todayClasses = schedule[todayName] || [];
            
            let currentClass = null;
            let nextClass = null;
            
            for (let cls of todayClasses) {
                const startTime = parseTime(cls.start, now);
                const endTime = parseTime(cls.end, now);
                
                if (now >= startTime && now <= endTime) {
                    currentClass = { ...cls, startTime, endTime };
                    break;
                } else if (now < startTime) {
                    if (!nextClass || startTime < nextClass.startTime) {
                        nextClass = { ...cls, startTime, endTime };
                    }
                }
            }

            const tagElem = document.getElementById('statusTag');
            const titleElem = document.getElementById('countdownTitle');
            const timerElem = document.getElementById('countdownTimer');
            const subtextElem = document.getElementById('countdownSubtext');

            if (currentClass) {
                activeClassId = currentClass.id;
                const secsRemaining = Math.max(0, Math.floor((currentClass.endTime - now) / 1000));
                
                tagElem.textContent = "In Class";
                tagElem.className = "status-tag in-class";
                titleElem.textContent = currentClass.title;
                timerElem.textContent = formatHMS(secsRemaining);
                subtextElem.textContent = `Ends at ${currentClass.time.split('-')[1].trim()}`;
            } else if (nextClass) {
                activeClassId = null;
                const secsUntil = Math.max(0, Math.floor((nextClass.startTime - now) / 1000));
                
                tagElem.textContent = "Up Next";
                tagElem.className = "status-tag";
                titleElem.textContent = nextClass.title;
                timerElem.textContent = formatHMS(secsUntil);
                subtextElem.textContent = `Starts at ${nextClass.time.split('-')[0].trim()}`;
            } else {
                activeClassId = null;
                tagElem.textContent = "Off Duty";
                tagElem.className = "status-tag";
                titleElem.textContent = todayClasses.length > 0 ? "Done for today!" : "No classes scheduled today";
                timerElem.textContent = "--:--:--";
                subtextElem.textContent = "Enjoy your free time";
            }

            // Auto-switch day view if user hasn't explicitly clicked a day
            if (!isUserSelected) {
                const defaultDay = (todayName === 'Saturday' || todayName === 'Sunday') ? 'Monday' : todayName;
                if (activeDay !== defaultDay) {
                    renderDay(defaultDay);
                } else {
                    highlightActiveClass();
                }
            } else {
                highlightActiveClass();
            }
        }

        function highlightActiveClass() {
            document.querySelectorAll('.class-card').forEach(card => {
                if (card.dataset.id === activeClassId) {
                    card.classList.add('is-active-class');
                    if (!card.querySelector('.live-badge')) {
                        const header = card.querySelector('.card-header');
                        const badge = document.createElement('span');
                        badge.className = 'live-badge';
                        badge.innerHTML = 'Now';
                        header.appendChild(badge);
                    }
                } else {
                    card.classList.remove('is-active-class');
                    const badge = card.querySelector('.live-badge');
                    if (badge) badge.remove();
                }
            });
        }

        function userSelectDay(day) {
            isUserSelected = true;
            renderDay(day);
        }

        function renderDay(day) {
            activeDay = day;
            
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach(btn => {
                if (btn.innerText.startsWith(day.substring(0,3))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';
            
            const classes = schedule[day] || [];
            if (classes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No classes scheduled</h3>
                        <p>Enjoy your day off!</p>
                    </div>
                `;
                return;
            }
            
            classes.forEach(cls => {
                const mapLink = getMapLink(cls.building);
                const isActive = cls.id === activeClassId;
                const card = document.createElement('article');
                card.className = `class-card ${isActive ? 'is-active-class' : ''}`;
                card.dataset.id = cls.id;
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="class-time">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            ${cls.time}
                        </div>
                        ${isActive ? '<span class="live-badge">Now</span>' : ''}
                    </div>
                    <h2 class="class-title">${cls.title}</h2>
                    <div class="class-location">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        ${cls.room}
                    </div>
                    ${mapLink 
                        ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="nav-btn">
                            Get Directions
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                           </a>`
                        : `<span class="nav-btn disabled">Location Pending</span>`
                    }
                `;
                container.appendChild(card);
            });
        }

        // Initialize and start persistent 1-second interval
        updateTracker();
        setInterval(updateTracker, 1000);
    </script>
</body>
</html>
