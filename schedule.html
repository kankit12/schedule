<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ecu-purple: #592A8A;
            --ecu-purple-dark: #421E68;
            --ecu-gold: #FDC82F;
            --bg-canvas: #FAFAFC;
            --surface: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border-subtle: #E2E8F0;
            --radius-card: 16px;
            --radius-btn: 10px;
            --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.03), 0 4px 12px rgba(15, 23, 42, 0.04);
            --shadow-active: 0 4px 12px rgba(89, 42, 138, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-canvas); 
            color: var(--text-primary); 
            min-height: 100vh;
            padding: 32px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 520px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: left;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ecu-purple);
            background: rgba(89, 42, 138, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .brand-badge::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--ecu-gold);
        }

        h1 { 
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        } 

        .day-selector { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr);
            gap: 8px; 
            background: rgba(226, 232, 240, 0.5);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px; 
            border: 1px solid var(--border-subtle);
        }

        .day-btn { 
            border: none; 
            padding: 10px 0;
            border-radius: 8px; 
            background: transparent; 
            color: var(--text-secondary); 
            font-weight: 600; 
            font-size: 0.875rem;
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .day-btn:hover {
            color: var(--text-primary);
        }

        .day-btn.active { 
            background-color: var(--surface); 
            color: var(--ecu-purple); 
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
            font-weight: 700;
        }

        .class-card { 
            background: var(--surface); 
            border-radius: var(--radius-card); 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-subtle);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .class-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .class-time { 
            font-size: 0.8125rem; 
            color: var(--text-secondary); 
            font-weight: 600; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #F1F5F9;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .class-title { 
            font-size: 1.125rem; 
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .class-location { 
            font-size: 0.875rem; 
            color: var(--text-secondary);
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .class-location svg {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .nav-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%; 
            padding: 12px 16px; 
            background-color: var(--ecu-purple); 
            color: white; 
            text-decoration: none; 
            border-radius: var(--radius-btn); 
            font-weight: 600; 
            font-size: 0.875rem;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-btn:hover {
            background-color: var(--ecu-purple-dark);
            box-shadow: var(--shadow-active);
        }

        .nav-btn svg {
            transition: transform 0.2s ease;
        }

        .nav-btn:hover svg {
            transform: translateX(2px);
        }

        .nav-btn.disabled { 
            background-color: #F1F5F9; 
            color: var(--text-muted);
            pointer-events: none;
            border: 1px solid var(--border-subtle);
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            background: var(--surface);
            border-radius: var(--radius-card);
            border: 1px dashed var(--border-subtle);
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand-badge">ECU Schedule</div>
            <h1>Class Navigator</h1>
        </header>
        
        <nav class="day-selector" id="daySelector" aria-label="Select day of the week">
            <button class="day-btn" onclick="selectDay('Monday')">Mon</button>
            <button class="day-btn" onclick="selectDay('Tuesday')">Tue</button>
            <button class="day-btn" onclick="selectDay('Wednesday')">Wed</button>
            <button class="day-btn" onclick="selectDay('Thursday')">Thu</button>
            <button class="day-btn" onclick="selectDay('Friday')">Fri</button>
        </nav>

        <main id="scheduleContainer" aria-live="polite"></main>
    </div>

    <script>
        const origin = "Greene Hall, East Carolina University";
        
        const schedule = {
            Monday: [
                { time: "09:00 AM - 09:50 AM", title: "CHEM 1150: General Chemistry I", room: "Sci & Tech, 0C307", building: "Science and Technology Building, East Carolina University" }
            ],
            Tuesday: [
                { time: "09:00 AM - 09:50 AM", title: "HLTH 1000: Health in Modern Society", room: "Brewster, 0C302", building: "Brewster Building, East Carolina University" },
                { time: "11:00 AM - 12:15 PM", title: "HNRS 2011: BLS Sem in Human", room: "Brewster, 0D207", building: "Brewster Building, East Carolina University" },
                { time: "12:30 PM - 01:45 PM", title: "BIOL 1100: Principles of Biology I", room: "Austin, 00205", building: "Austin Building, East Carolina University" },
                { time: "05:00 PM - 07:00 PM", title: "HNRS 2000: Honors Leadership & Service Colloquium", room: "Rawl, 00205", building: "Rawl Building, East Carolina University" }
            ],
            Wednesday: [
                { time: "09:00 AM - 09:50 AM", title: "CHEM 1150: General Chemistry I", room: "Sci & Tech, 0C307", building: "Science and Technology Building, East Carolina University" },
                { time: "11:00 AM - 01:50 PM", title: "CHEM 1151: General Chemistry Lab I", room: "Sci & Tech, 00432", building: "Science and Technology Building, East Carolina University" },
                { time: "03:30 PM - 06:30 PM", title: "HNRS 2002: Survey of Health Professions", room: "Health Sciences Campus", building: "Health Sciences Campus, East Carolina University" }
            ],
            Thursday: [
                { time: "09:00 AM - 09:50 AM", title: "HLTH 1000: Health in Modern Society", room: "Brewster, 0C302", building: "Brewster Building, East Carolina University" },
                { time: "11:00 AM - 12:15 PM", title: "HNRS 2011: BLS Sem in Human", room: "Brewster, 0D207", building: "Brewster Building, East Carolina University" },
                { time: "12:30 PM - 01:45 PM", title: "BIOL 1100: Principles of Biology I", room: "Austin, 00205", building: "Austin Building, East Carolina University" }
            ],
            Friday: [
                { time: "09:00 AM - 09:50 AM", title: "CHEM 1150: General Chemistry I", room: "Sci & Tech, 0C307", building: "Science and Technology Building, East Carolina University" }
            ]
        };

        function getMapLink(destination) {
            if (!destination) return null;
            return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=walking`;
        }

        function selectDay(day) {
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach(btn => {
                if (btn.innerText.startsWith(day.substring(0,3))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';
            
            const classes = schedule[day] || [];
            if (classes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No classes scheduled</h3>
                        <p>Enjoy your free time!</p>
                    </div>
                `;
                return;
            }
            
            classes.forEach(cls => {
                const mapLink = getMapLink(cls.building);
                const card = document.createElement('article');
                card.className = 'class-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="class-time">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            ${cls.time}
                        </div>
                    </div>
                    <h2 class="class-title">${cls.title}</h2>
                    <div class="class-location">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        ${cls.room}
                    </div>
                    ${mapLink 
                        ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="nav-btn">
                            Get Walking Directions
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                           </a>`
                        : `<span class="nav-btn disabled">Location Pending</span>`
                    }
                `;
                container.appendChild(card);
            });
        }

        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        let today = days[new Date().getDay()];
        
        if (today === 'Sunday' || today === 'Saturday') {
            today = 'Monday';
        }
        
        selectDay(today);
    </script>
</body>
</html>
